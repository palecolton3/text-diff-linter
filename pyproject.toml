[project]
name = "difflint"
version = "0.1.0"
description = "Lint the added lines of a unified diff for common problems."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "palecolton3" }]

[project.scripts]
difflint = "difflint.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
